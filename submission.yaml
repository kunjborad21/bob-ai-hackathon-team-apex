submission:
  title: "PharmaGuard AI — Drug Safety Signal Detector & Regulatory Submission Readiness Checker"
  problem_statement: >
    Pharmacovigilance and regulatory teams need efficient ways to identify
    potential drug safety signals from adverse-event reports and check the
    completeness of regulatory submission dossiers. These tasks require
    analyzing large amounts of information and identifying important gaps
    efficiently.
  solution_summary: >
    PharmaGuard AI is a web-based prototype with two modules: Signal Detection
    and Submission Readiness. It uses PRR-based signal detection, K-Means
    clustering, explainability, and an ICH M4-based CTD completeness checker
    to identify potential safety signals and regulatory submission gaps using
    synthetic demonstration data.
