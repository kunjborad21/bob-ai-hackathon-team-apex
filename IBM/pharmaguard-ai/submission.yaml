      - numpy
      - scikit-learn
      - scipy
      - pydantic
      - uvicorn
  frontend:
    language: JavaScript (React 18 + JSX)
    build_tool: Vite 5
    key_libraries:
      - react-router-dom
      - recharts
      - axios
      - tailwindcss

