# ── Problem Statement ─────────────────────────────────────────────────────────
problem_statement: >
  Pharmacovigilance teams manually sift through thousands of adverse-event
  reports to detect drug-safety signals — a process that is slow, error-prone,
  and hard to explain to regulators. Separately, regulatory-affairs teams spend
  weeks verifying whether a Common Technical Document (CTD) dossier meets the
  ICH M4 structure required for market-authorisation submissions. Both tasks
  demand expert knowledge, are repetitive, and lack real-time feedback.

# ── Solution Summary ──────────────────────────────────────────────────────────
solution_summary: >
  PharmaGuard AI is a full-stack pharmacovigilance prototype that automates two
  high-value tasks. The Signal Detection module applies the Evans 2001 PRR
  algorithm plus K-Means clustering to 500 synthetic adverse-event reports,
  surfaces statistically significant drug-event signals ranked by strength, and
  provides plain-English explainability for each finding. The Submission
  Readiness module validates a synthetic ICH M4 CTD dossier against all 74
  required sections across 5 modules, produces a severity-ranked gap list, and
  generates actionable recommendations — giving teams an instant completeness
  score before a regulatory filing.

# ── Technology Stack ──────────────────────────────────────────────────────────
tech_stack:
  backend:
    language: Python 3.12
    framework: FastAPI 0.111+
    key_libraries:
